databaseChangeLog:
  # Add one includeAll (or one include per file) per new changeset file.
  # Never edit a changeset that has already run against a shared database —
  # add a new file/changeset instead.
  # Example:
  # - include:
  #     file: db/changelog/changes/001-create-customer-table.yaml
  - include:
      file: changes/001-create-customer-table.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/002-create-product-table.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/003-create-order-table.yaml
      relativeToChangelogFile: true
  - include:
      file: changes/004-create-order-item-table.yaml
      relativeToChangelogFile: true
