databaseChangeLog:
  - changeSet:
      id: 024-create-cart-and-cart-items-table
      author: oms
      validCheckSum: "*"
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - onError: CONTINUE
        - not:
            - tableExists:
                tableName: carts
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_carts
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_cart_customer
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: customer_id
            constraintName: fk_cart_customer
            referencedTableName: customers
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_items
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            constraintName: fk_cart_item_cart
            referencedTableName: carts
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: product_id
            constraintName: fk_cart_item_product
            referencedTableName: products
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addUniqueConstraint:
            tableName: cart_items
            columnNames: cart_id, product_id
            constraintName: uk_cart_item_cart_product

        - createIndex:
            indexName: idx_cart_items_cart_id
            tableName: cart_items
            columns:
              - column:
                  name: cart_id
