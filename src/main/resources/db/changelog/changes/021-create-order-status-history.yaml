databaseChangeLog:
  - changeSet:
      id: 021-create-order-status-history
      author: oms
      validCheckSum: "*"
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: order_status_history
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_status_history
                    nullable: false
              - column:
                  name: order_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: from_status
                  type: VARCHAR(30)
              - column:
                  name: to_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: changed_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: order_status_history
            baseColumnNames: order_id
            constraintName: fk_history_orders
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
