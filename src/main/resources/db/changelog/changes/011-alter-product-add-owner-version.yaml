databaseChangeLog:
  - changeSet:
      id: 011-alter-product-add-owner
      author: oms
      validCheckSum: "*"
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: products
                columnName: owner_id
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: owner_id
            constraintName: fk_products_owner
            referencedTableName: users
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: CASCADE

        - createIndex:
            indexName: idx_product_owner
            tableName: products
            columns:
              - column:
                  name: owner_id
