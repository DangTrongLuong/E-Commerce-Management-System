databaseChangeLog:
  - changeSet:
      id: 023-create-email-outbox-table
      author: oms
      validCheckSum: "*"
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: email_outbox
      changes:
        - createTable:
            tableName: email_outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_outbox
                    nullable: false
              - column:
                  name: template
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: recipient
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_error
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            tableName: email_outbox
            columnNames: template, reference_id
            constraintName: uk_email_outbox_tpl_ref

        - createIndex:
            indexName: idx_email_outbox_status_next
            tableName: email_outbox
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at
