databaseChangeLog:
  - changeSet:
      id: 028-create-sub-orders-table
      author: oms
      failOnError: true
      changes:
        - createTable:
            tableName: sub_orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sub_orders
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sub_order_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: po_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: total_amount
                  type: DECIMAL(15,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(30)
                  defaultValue: UNPAID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: sub_orders
            baseColumnNames: order_id
            constraintName: fk_sub_orders_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: sub_orders
            baseColumnNames: po_id
            constraintName: fk_sub_orders_po
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            indexName: idx_sub_orders_order_id
            tableName: sub_orders
            columns:
              - column:
                  name: order_id

        - addColumn:
            tableName: order_items
            columns:
              - column:
                  name: sub_order_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: sub_order_id
            constraintName: fk_order_items_sub_order
            referencedTableName: sub_orders
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: RESTRICT

        - addColumn:
            tableName: purchase_ticket
            columns:
              - column:
                  name: sub_order_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - dropForeignKeyConstraint:
            baseTableName: purchase_ticket
            constraintName: fk_ticket_order

        - dropUniqueConstraint:
            tableName: purchase_ticket
            constraintName: uk_purchase_ticket_order
            uniqueColumns: order_id

        - createIndex:
            indexName: idx_purchase_ticket_order_id
            tableName: purchase_ticket
            columns:
              - column:
                  name: order_id

        - addForeignKeyConstraint:
            baseTableName: purchase_ticket
            baseColumnNames: order_id
            constraintName: fk_ticket_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableName: purchase_ticket
            baseColumnNames: sub_order_id
            constraintName: fk_purchase_ticket_sub_order
            referencedTableName: sub_orders
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addColumn:
            tableName: payment_transaction
            columns:
              - column:
                  name: sub_order_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: payment_transaction
            baseColumnNames: sub_order_id
            constraintName: fk_payment_transaction_sub_order
            referencedTableName: sub_orders
            referencedColumnNames: id
            onDelete: SET NULL
            onUpdate: RESTRICT
