databaseChangeLog:
  - changeSet:
      id: 016-alter-app-user-add-token-version
      author: oms
      validCheckSum: "*"
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: users
                columnName: token_version
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: token_version
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
