databaseChangeLog:
  - changeSet:
      id: 019-alter-product-add-image-url
      author: oms
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: products
                columnName: image_url
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: image_url
                  type: VARCHAR(500)
