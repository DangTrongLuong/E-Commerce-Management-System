databaseChangeLog:
  - changeSet:
      id: 018-drop-app-user-if-exists
      author: oms
      failOnError: false
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: app_user
      changes:
        - dropTable:
            tableName: app_user
            cascadeConstraints: true

