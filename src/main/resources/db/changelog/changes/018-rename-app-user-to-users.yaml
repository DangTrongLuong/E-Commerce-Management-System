databaseChangeLog:
  - changeSet:
      id: 018-rename-app-user-to-users
      author: oms
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: app_user
        - not:
            - tableExists:
                tableName: users
      changes:
        - renameTable:
            oldTableName: app_user
            newTableName: users

