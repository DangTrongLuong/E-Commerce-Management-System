spring:

  config:
    import: optional:file:.env[.properties]

  application:
    name: ecommerce

  # ---- Database connection ----
  # Fill in once you've added your JDBC driver dependency in build.gradle.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Required by the assignment: schema is managed by Liquibase, not Hibernate.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- Liquibase ----
  # Runs automatically on application startup.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    com.example.ecommerce: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
