spring:

  config:
    import: optional:file:.env[.properties]

  application:
    name: ecommerce

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_boolean_jdbc_type: TINYINT


  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    mail-receiver: ${MAIL_RECEIVER}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

app:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    username: ${REDIS_USERNAME}
    password: ${REDIS_PASSWORD}
    ssl: ${REDIS_SSL}
    timeout-ms: 3000

server:
  port: 8080

logging:
  level:
    com.example.ecommerce: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL}
  return-url: ${VNPAY_RETURN_URL}
  api-version: 2.1.0
  command: pay
  order-type: other
  currency-code: VND
  default-locale: vn
  expire-minutes: 15
