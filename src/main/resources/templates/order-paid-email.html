<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận thanh toán đơn hàng</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #000000;
            padding: 24px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #000000;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        p {
            margin: 10px 0;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 13px;
        }

        th,
        td {
            border: 1px solid #000000;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .total-section {
            margin-top: 15px;
            margin-bottom: 25px;
            padding: 12px 0;
            border-top: 1px solid #000000;
            border-bottom: 1px solid #000000;
            font-size: 15px;
        }

        .total-amount {
            font-weight: bold;
            float: right;
        }

        .clear {
            clear: both;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #555555;
            border-top: 1px dashed #cccccc;
            padding-top: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Xác nhận thanh toán đơn hàng</h2>

        <p>Xin chào <strong th:text="${customerName}">Nguyễn Văn An</strong>,</p>

        <p>Đơn hàng #<strong th:text="${orderId}">100</strong> đã được thanh toán lúc <strong
                th:text="${paidAt}">07/10/2026 09:30</strong>.</p>

        <table>
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th class="text-center" style="width: 50px;">SL</th>
                    <th class="text-right" style="width: 120px;">Đơn giá</th>
                    <th class="text-right" style="width: 130px;">Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.productName}">iPhone 16 128GB</td>
                    <td class="text-center" th:text="${item.quantity}">2</td>
                    <td class="text-right" th:text="${item.unitPriceFormatted}">22.990.000 ₫</td>
                    <td class="text-right" th:text="${item.subtotalFormatted}">45.980.000 ₫</td>
                </tr>
            </tbody>
        </table>

        <div class="total-section">
            <strong>Tổng thanh toán:</strong>
            <span class="total-amount" th:text="${totalAmountFormatted}">45.980.000 ₫</span>
            <div class="clear"></div>
        </div>


    </div>
</body>

</html>
