import com.sun.org.apache.xalan.internal.xsltc.compiler.If

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ---- Core (required by the assignment) ----
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Liquibase — required for schema migration (do NOT use ddl-auto=update/create).
	// Put your changelogs under src/main/resources/db/changelog/
	implementation 'org.liquibase:liquibase-core'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ---- Database driver ----
	// Add your chosen driver here (left out on purpose — add it yourself), e.g.:
	// runtimeOnly 'org.postgresql:postgresql'
	 runtimeOnly 'com.mysql:mysql-connector-j'
	// runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

	// ---- Testing ----
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// =====================================================================
	// OPTIONAL / BONUS — uncomment whichever sections your interns attempt.
	// =====================================================================

	// --- #12 DTO mapping (MapStruct) ---
	 implementation 'org.mapstruct:mapstruct:1.6.3'
	 annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
//	 If combining MapStruct with Lombok, also add (order matters, keep this last):
	 annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// --- #15 Spring Security + JWT ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	testImplementation 'org.springframework.security:spring-security-test'

	// --- #16 Scheduled Job ---
	// No extra dependency needed — just add @EnableScheduling + @Scheduled.

	// --- #17 Spring Batch (CSV import) ---
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	testImplementation 'org.springframework.batch:spring-batch-test'
	implementation 'org.apache.commons:commons-csv:1.11.0'

	// --- #18 Optimistic Locking (@Version) ---
	// No extra dependency needed — it's built into Spring Data JPA.

	// --- #19 Testing with Testcontainers ---
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'


	// --- #20 Swagger / OpenAPI ---
	 implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
}

tasks.named('test') {
	useJUnitPlatform()
}
